# ==============================================================================
# Nginx Configuration for AttendanceSystem Reverse Proxy (Amazon EC2)
# File location on server: /etc/nginx/sites-available/attendance
# Symlink: /etc/nginx/sites-enabled/attendance
# ==============================================================================

server {
    listen 80;
    server_name your-domain.com www.your-domain.com;

    # Redirect all HTTP traffic to HTTPS (Enabled after Certbot TLS installation)
    # return 301 https://$host$request_uri;

    client_max_body_size 16M;

    # Static file serving directly via Nginx for high performance
    location /static/ {
        alias /var/www/AttendanceSystem/static/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Pass all other requests to Gunicorn WSGI server
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Custom Error Pages
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
