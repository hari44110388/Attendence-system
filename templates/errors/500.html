{% extends "base.html" %}

{% block title %}500 Internal Server Error{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
  <div class="col-md-6 text-center">
    <div class="p-5 bg-white rounded-3 shadow-sm border">
      <div class="text-danger mb-3" style="font-size: 4rem;">
        <i class="bi bi-exclamation-octagon"></i>
      </div>
      <h2 class="fw-bold mb-2">500 - Server Error</h2>
      <p class="text-muted mb-4">An unexpected internal server error occurred while processing your request. Please try again or contact system administrators.</p>
      <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary-custom px-4">
        <i class="bi bi-house-door-fill me-1"></i> Return to Dashboard
      </a>
    </div>
  </div>
</div>
{% endblock %}
